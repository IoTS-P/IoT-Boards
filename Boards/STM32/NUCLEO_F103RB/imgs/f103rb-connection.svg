<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">NUCLEO-F103RB wiring for USART2 DMA debugging</title>
  <desc id="desc">PC connects by data-capable Mini-USB cable to CN1 ST-LINK on NUCLEO-F103RB. Internal SWD and USART2 virtual COM lines connect to target MCU. No external antenna.</desc>
  <rect width="1200" height="610" fill="#f5f7fb"/>
  <text x="42" y="56" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#172b4d">NUCLEO-F103RB · USART2 + DMA real-board setup</text>
  <rect x="55" y="175" width="260" height="255" rx="22" fill="#dbe8ff" stroke="#3065a8" stroke-width="4"/>
  <text x="95" y="230" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172b4d">PC / IDE</text>
  <text x="95" y="280" font-family="Arial,sans-serif" font-size="21" fill="#172b4d">STM32CubeIDE</text>
  <text x="95" y="315" font-family="Arial,sans-serif" font-size="21" fill="#172b4d">or OpenOCD + GDB</text>
  <text x="95" y="365" font-family="Arial,sans-serif" font-size="19" fill="#344b6d">GDB + serial terminal</text>
  <path d="M315 300 H515" fill="none" stroke="#0869bc" stroke-width="12" stroke-linecap="round"/>
  <text x="330" y="264" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#08528b">Mini-USB B data cable</text>
  <rect x="515" y="125" width="620" height="390" rx="25" fill="#e7f1e8" stroke="#257a4b" stroke-width="5"/>
  <text x="560" y="173" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#17472d">NUCLEO-F103RB (MB1136)</text>
  <rect x="555" y="225" width="245" height="235" rx="15" fill="#c5e4d1" stroke="#257a4b" stroke-width="3"/>
  <text x="580" y="265" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17472d">CN1 / ST-LINK</text>
  <text x="580" y="305" font-family="Arial,sans-serif" font-size="20" fill="#17472d">USB power + SWD</text>
  <text x="580" y="340" font-family="Arial,sans-serif" font-size="20" fill="#17472d">Virtual COM port</text>
  <text x="580" y="400" font-family="Arial,sans-serif" font-size="18" fill="#17472d">CN2 jumpers: fitted</text>
  <path d="M800 295 H865" fill="none" stroke="#257a4b" stroke-width="7"/>
  <path d="M800 335 H865" fill="none" stroke="#0e83a5" stroke-width="7"/>
  <text x="807" y="284" font-family="Arial,sans-serif" font-size="17" fill="#17472d">SWD</text>
  <text x="807" y="368" font-family="Arial,sans-serif" font-size="17" fill="#0e647d">USART2</text>
  <rect x="865" y="225" width="225" height="235" rx="15" fill="#fff" stroke="#257a4b" stroke-width="3"/>
  <text x="890" y="265" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17472d">STM32F103RB</text>
  <text x="890" y="310" font-family="Arial,sans-serif" font-size="18" fill="#17472d">PA2 TX / PA3 RX</text>
  <text x="890" y="345" font-family="Arial,sans-serif" font-size="18" fill="#17472d">DMA1 Ch6 / Ch7</text>
  <text x="890" y="400" font-family="Arial,sans-serif" font-size="18" fill="#17472d">B1 USER button</text>
  <text x="55" y="560" font-family="Arial,sans-serif" font-size="22" fill="#344b6d">JP5: U5V 1–2 · No external SWD wires · No antenna · Send 8-byte “Password” via ST-LINK VCP</text>
</svg>
